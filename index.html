    * { box-sizing: border-box; }

    }
    h1, h2, h3, h4, h5, h6 { font-family: 'Figtree', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #F0FDFA; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #99F6E4; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #5EEAD4; }
    input:focus, select:focus, textarea:focus, button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.4);
    }
    input[type="checkbox"] {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 1px solid #99F6E4;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
      flex-shrink: 0;
    }
    input[type="checkbox"]:checked {
      background: linear-gradient(135deg, #0891B2, #0E7490);
      border-color: #0891B2;
    }
    input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 2px;
      width: 6px;
      height: 10px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      animation: checkBounce 0.3s ease-out;
    }
    input[type="checkbox"]:hover { border-color: #2DD4BF; }
    input[type="radio"] {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 1px solid #99F6E4;
      border-radius: 50%;
      background: white;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
      flex-shrink: 0;
    }
    input[type="radio"]:checked { border-color: #0891B2; }
    input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 4px;
      width: 8px;
      height: 8px;
      background: linear-gradient(135deg, #0891B2, #0E7490);
      border-radius: 50%;
      animation: scaleIn 0.15s ease-out;
    }
    input[type="radio"]:hover { border-color: #2DD4BF; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: #0891B2;
      color: white;
      padding: 8px 16px;
      z-index: 100;
      border-radius: 0 0 8px 0;
    }
    .skip-link:focus { top: 0; }
    #main-content { scroll-margin-top: 180px; }
    .tab-scroll { scrollbar-width: none; }
    .tab-scroll::-webkit-scrollbar { display: none; }
    @media (max-width: 640px) {
      body { font-size: 15px; }
      #main-content { scroll-margin-top: 132px; }
    }
  </style>

    // MAIN APP
    function MedicalExamApp() {
      const [formData, setFormData] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? JSON.parse(saved) : {};
        } catch (error) {
          return {};
        }
      });
      const [activeMainTab, setActiveMainTab] = useState('tienCan');
      const [showOutput, setShowOutput] = useState(false);
      const [showResetConfirm, setShowResetConfirm] = useState(false);
      const [isGenerating, setIsGenerating] = useState(false);
      const [outputText, setOutputText] = useState('');
      const [toast, setToast] = useState(null);
      const [saveStatus, setSaveStatus] = useState('');
      const toastTimerRef = useRef(null);
      const saveTimerRef = useRef(null);
      const firstSaveRef = useRef(true);

      const showToast = useCallback((message, type = 'success') => {
        setToast({ message, type });
        window.clearTimeout(toastTimerRef.current);
        toastTimerRef.current = window.setTimeout(() => setToast(null), 2200);
      }, []);

      const updateField = useCallback((key, value) => { setFormData(prev => ({ ...prev, [key]: value })); }, []);
      const requestReset = useCallback(() => { setShowResetConfirm(true); }, []);
      const resetForm = useCallback(() => {
        setFormData({});
        setOutputText('');
        setShowOutput(false);
        setShowResetConfirm(false);
        localStorage.removeItem(STORAGE_KEY);
        showToast('Đã xóa dữ liệu nhập.', 'warning');
      }, [showToast]);

      React.useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(formData));
          if (!firstSaveRef.current) {
            setSaveStatus('Đã lưu tự động');
            window.clearTimeout(saveTimerRef.current);
            saveTimerRef.current = window.setTimeout(() => setSaveStatus(''), 1800);
          }
          firstSaveRef.current = false;
        } catch (error) {
          setSaveStatus('Không thể lưu tự động');
        }
      }, [formData]);

      React.useEffect(() => () => {
        window.clearTimeout(toastTimerRef.current);
        window.clearTimeout(saveTimerRef.current);
      }, []);

      // Keyboard shortcuts for tab navigation
      React.useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.ctrlKey || e.metaKey) {
            switch(e.key) {
              case '1': e.preventDefault(); setActiveMainTab('tienCan'); break;
              case '2': e.preventDefault(); setActiveMainTab('benhSu'); break;
              case '3': e.preventDefault(); setActiveMainTab('kham'); break;
              case '4': e.preventDefault(); setActiveMainTab('chiDinh'); break;
              case '5': e.preventDefault(); setActiveMainTab('ketQua'); break;
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const caputeScores = useMemo(() => {
        const tuoiThang = parseFloat(formData.tuoiThang) || 0;
        const clams = parseFloat(formData.clams) || 0;
        const cat = parseFloat(formData.cat) || 0;
        const clamsDQ = tuoiThang > 0 ? Math.round((clams / tuoiThang) * 100) : 0;
        const catDQ = tuoiThang > 0 ? Math.round((cat / tuoiThang) * 100) : 0;
        const fullScaleDQ = Math.round((clamsDQ + catDQ) / 2);
        return { clamsDQ, catDQ, fullScaleDQ };
      }, [formData.tuoiThang, formData.clams, formData.cat]);

      // Calculate progress for each tab
      const tabProgress = useMemo(() => {
        const countFilled = (fields) => fields.filter(f => {
          const val = formData[f];
          if (Array.isArray(val)) return val.length > 0;
          if (typeof val === 'boolean') return val;
          return val && val.toString().trim() !== '';
        }).length;
        
        const tienCanFields = ['thuTu1', 'thuTu2', 'cachSinh', 'tuoiThai', 'cnls', 'batThuongSauSinh', 'bietDi', 'bietNoi', 'tinhTrangKham', 'songVoi'];
        const benhSuFields = ['loLang', 'pvDapUngTen', 'pvTuongTac', 'pvGiaoTiepMat', 'pvChoiVoiNguoiKhac', 'hanhViLapLai', 'bamViuThoiQuen', 'soThichHanChe'];
        const khamFields = ['nepVao', 'danhGiaKhiTuChoi', 'hanhViKham', 'khamDapUngTen', 'khamTheHienCamXuc', 'khamTuongTacNguoiKham', 'khamTiepXucMat', 'khamChiNgonTro', 'khamChuYChung', 'khamBieuCam', 'khamHopTac', 'khamChoiGiaBo', 'khamChoiLuanPhien', 'khamSayMeChoi'];
        const chiDinhFields = ['openADHDPH', 'openADHDGV', 'openNEMI', 'openWISC', 'openATEC'];
        const ketQuaFields = ['chanDoan', 'hocLuaChon', 'huongDanPH', 'taiKham'];
        
        return {
          tienCan: Math.round((countFilled(tienCanFields) / tienCanFields.length) * 100),
          benhSu: Math.round((countFilled(benhSuFields) / benhSuFields.length) * 100),
          kham: Math.round((countFilled(khamFields) / khamFields.length) * 100),
          chiDinh: Math.round((countFilled(chiDinhFields) / chiDinhFields.length) * 100),
          ketQua: Math.round((countFilled(ketQuaFields) / ketQuaFields.length) * 100)
        };
      }, [formData]);

      const generateOutput = useCallback(() => {
        let lines = [];
        let hasTienCan = false, hasBenhSu = false, hasKham = false, hasChiDinh = false, hasChanDoan = false, hasDieuTri = false;

        // TIỀN CĂN
        let tienCanLines = [];
        let phatTrienLines = [];
        let birthParts = [];
        if (formData.thuTu1 || formData.thuTu2) birthParts.push(`Con ${formData.thuTu1 || '..'}/${formData.thuTu2 || '..'}`);
        if (formData.cachSinh?.length > 0) birthParts.push(formData.cachSinh.join(', '));
        if (formData.tuoiThai === 'đủ tháng') birthParts.push('đủ tháng');
        else if (formData.tuoiThai === 'non tháng' && formData.soTuanThai) birthParts.push(`thai ${formData.soTuanThai} tuần`);
        if (formData.cnls) birthParts.push(`CNLS: ${formData.cnls} kg`);
        if (birthParts.length > 0) phatTrienLines.push('- ' + birthParts.join(', ') + '.');
        if (formData.khongBatThuongLucSinh) phatTrienLines.push('- Không ghi nhận bất thường lúc sinh.');
        if (formData.coBatThuongLucSinh) phatTrienLines.push(`- Bất thường lúc sinh: ${formData.batThuongLucSinhDetail || '...'}`);
        if (formData.batThuongSauSinh) phatTrienLines.push('- Không ghi nhận bất thường sau sinh.');
        let devParts = [];
        if (formData.bietDi) devParts.push(`Biết đi lúc ${formData.bietDi} tháng`);
        if (formData.bietNoi === 'đã biết nói' && formData.thangNoi) devParts.push(`biết nói từ đơn lúc ${formData.thangNoi} tháng`);
        else if (formData.bietNoi === 'chưa biết nói') devParts.push('chưa biết nói');
        if (devParts.length > 0) phatTrienLines.push('- ' + devParts.join(', ') + '.');
        if (formData.benhManTinh) phatTrienLines.push(`- Bệnh mãn tính đang điều trị: ${formData.benhManTinh}`);
        if (formData.hienDangHoc) phatTrienLines.push(`- Hiện đang học: ${formData.hienDangHoc}${formData.hienDangHocThoiGian ? `, thời gian ${formData.hienDangHocThoiGian} tháng` : ''}`);
        if (phatTrienLines.length > 0) { tienCanLines.push('Quá trình phát triển:'); tienCanLines = tienCanLines.concat(phatTrienLines); }

        let benhSuLines = [];
        if (formData.tinhTrangKham === 'chuaKham') { benhSuLines.push('- Chưa khám lần nào.'); }
        else if (formData.tinhTrangKham === 'daKham') {
          let khamParts = [];
          if (formData.tuoiKham) khamParts.push(`Lúc ${formData.tuoiKham} tháng`);
          if (formData.noiKham?.length > 0) khamParts.push(`khám tại ${formData.noiKham.join(', ')}`);
          let ldParts = [];
          if (formData.lyDoKham?.length > 0) ldParts = ldParts.concat(formData.lyDoKham);
          if (formData.lyDoKhamKhac) ldParts.push(formData.lyDoKhamKhac);
          if (ldParts.length > 0) khamParts.push(`vì ${ldParts.join(', ')}`);
          let cdParts = [];
          if (formData.chanDoanTruoc?.length > 0) cdParts = cdParts.concat(formData.chanDoanTruoc);
          if (formData.chanDoanTruocKhac) cdParts.push(formData.chanDoanTruocKhac);
          if (cdParts.length > 0) khamParts.push(`chẩn đoán: ${cdParts.join(', ')}`);
          if (khamParts.length > 0) benhSuLines.push('- ' + khamParts.join('; ') + '.');
          if (formData.sauKham) {
            let canThiepParts = ['Sau khám: học trường hòa nhập và học can thiệp'];
            if (formData.gioCanThiep || formData.ngayCanThiep) canThiepParts.push(`tần suất: ${formData.gioCanThiep || '...'} giờ/ngày x ${formData.ngayCanThiep || '...'} ngày/tuần cho đến hiện tại`);
            if (formData.tongThoiGianCanThiep) canThiepParts.push(`tổng thời gian ${formData.tongThoiGianCanThiep} tháng`);
            benhSuLines.push('- ' + canThiepParts.join(', ') + '.');
          }
        }
        if (benhSuLines.length > 0) { tienCanLines.push('Tiền sử khám tâm lý:'); tienCanLines = tienCanLines.concat(benhSuLines); }

        let moiTruongLines = [];
        if (formData.songVoi?.length > 0) moiTruongLines.push(`- Bé đang sống với ${formData.songVoi.join(', ')}.`);
        let screenParts = [];
        if (formData.screenTruocDay) screenParts.push(`trước đây khoảng ${formData.screenTruocDay} giờ mỗi ngày`);
        if (formData.screenDaNgung) screenParts.push(`đã ngừng ${formData.screenDaNgung} tháng nay`);
        if (formData.screenHienTai) screenParts.push(`hiện tại: ${formData.screenHienTai} giờ mỗi ngày`);
        if (screenParts.length > 0) moiTruongLines.push(`- Thời gian tiếp xúc màn hình: ${screenParts.join('. ')}.`);
        if (moiTruongLines.length > 0) { tienCanLines.push('Môi trường sống:'); tienCanLines = tienCanLines.concat(moiTruongLines); }

        if (tienCanLines.length > 0) { hasTienCan = true; lines.push('TIỀN CĂN'); lines = lines.concat(tienCanLines); }

        // BỆNH SỬ (tab mới)
        let benhSuTabLines = [];
        let loLangLines = [];
        if (formData.loLang?.length > 0) { formData.loLang.forEach(item => loLangLines.push(`- ${item}`)); }
        if (formData.loLangKhac) loLangLines.push(`- ${formData.loLangKhac}`);
        if (formData.loLangNote) loLangLines.push(`- ${formData.loLangNote}`);
        if (loLangLines.length > 0) { benhSuTabLines.push('Các lo lắng hiện tại của phụ huynh:'); benhSuTabLines = benhSuTabLines.concat(loLangLines); }

        let phongVanLines = [];
        let aLines = [];
        if (formData.pvDapUngTen) aLines.push(`Đáp ứng tên gọi: ${formData.pvDapUngTen}`);
        if (formData.pvTuongTac) aLines.push(`Khởi đầu tương tác: ${formData.pvTuongTac}`);
        if (formData.pvKhoe) aLines.push(`Khoe và gây chú ý: ${formData.pvKhoe}`);
        if (formData.pvCuoiXaHoi) aLines.push(`Cười xã hội: ${formData.pvCuoiXaHoi}`);
        if (formData.pvTuongTacXaHoiNote) aLines.push(`Ghi chú: ${formData.pvTuongTacXaHoiNote}`);
        if (aLines.length > 0) { phongVanLines.push('Tương tác xã hội - cảm xúc'); aLines.forEach(l => phongVanLines.push(`- ${l}`)); }

        navigator.clipboard.writeText(outputText)
          .then(() => { showToast('Đã sao chép vào clipboard.', 'success'); })
          .catch(() => { showToast('Không thể sao chép tự động.', 'warning'); });
      }, [outputText, showToast]);

      const exportToWord = useCallback(async () => {
        try {
        const { Document, Packer, Paragraph, TextRun } = await loadDocx();
        const lines = outputText.split('\n');
        const children = [];
        lines.forEach((line) => {
          if (!line.trim()) { children.push(new Paragraph({ children: [] })); return; }
          if (['TIỀN CĂN', 'BỆNH SỬ', 'KHÁM', 'KẾT QUẢ CHỈ ĐỊNH', 'CHẨN ĐOÁN', 'ĐIỀU TRỊ/CAN THIỆP'].includes(line)) {
            children.push(new Paragraph({
              children: [new TextRun({ text: line, bold: true, size: 28, font: 'Times New Roman' })],
              spacing: { before: 300, after: 150 },
            }));
          } else if (/^[A-ZÀ-Ỵa-zà-ỵ].+:$/.test(line) && !line.startsWith('-') && !line.startsWith('*')) {
            // Subsection headers (lines ending with colon)
            children.push(new Paragraph({
              children: [new TextRun({ text: line, bold: true, size: 26, font: 'Times New Roman' })],
              spacing: { before: 180, after: 80 },
            }));
          } else if (line.startsWith('- ') || line.startsWith('• ')) {
            children.push(new Paragraph({
              children: [new TextRun({ text: '• ' + line.substring(2), size: 24, font: 'Times New Roman' })],
              indent: { left: 720 },
              spacing: { before: 60, after: 60 },
            }));
          } else if (line.startsWith('   - ')) {
            children.push(new Paragraph({
              children: [new TextRun({ text: '• ' + line.substring(5), size: 24, font: 'Times New Roman' })],
              indent: { left: 1440 },
              spacing: { before: 40, after: 40 },
            }));
          } else if (line.startsWith('* ')) {
            children.push(new Paragraph({
              children: [new TextRun({ text: line, size: 24, font: 'Times New Roman' })],
              indent: { left: 360 },
              spacing: { before: 80, after: 80 },
            }));
          } else {
            children.push(new Paragraph({
              children: [new TextRun({ text: line, size: 24, font: 'Times New Roman' })],
              spacing: { before: 60, after: 60 },
            }));
          }
        });

        const doc = new Document({
          sections: [{
            properties: {
              page: {
                size: { width: 12240, height: 15840 },
                margin: { top: 1440, right: 1440, bottom: 1440, left: 1440 },
              },
            },
            children: children,
          }],
        });

        const blob = await Packer.toBlob(doc);
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ket-qua-kham.docx';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
        showToast('Đã tải file Word.', 'success');
        } catch (error) {
          showToast('Không thể tải Word lúc này. Vui lòng thử lại.', 'warning');
        }
      }, [outputText, showToast]);

      const tabs = [
        { id: 'tienCan', label: 'Tiền căn', icon: Icons.clipboard, shortLabel: 'TC', progress: tabProgress.tienCan },
        { id: 'benhSu', label: 'Bệnh sử', icon: Icons.chat, shortLabel: 'BS', progress: tabProgress.benhSu },
        { id: 'kham', label: 'Khám', icon: Icons.stethoscope, shortLabel: 'K', progress: tabProgress.kham },
        { id: 'chiDinh', label: 'Chỉ định', icon: Icons.document, shortLabel: 'CĐ', progress: tabProgress.chiDinh },
        { id: 'ketQua', label: 'Kết quả khám', icon: Icons.chart, shortLabel: 'KQ', progress: tabProgress.ketQua },
      ];
      const activeIndex = tabs.findIndex(tab => tab.id === activeMainTab);
      const nextTab = activeIndex >= 0 ? tabs[activeIndex + 1] : null;
      const goToNextTab = useCallback(() => {
        if (!nextTab) return;
        setActiveMainTab(nextTab.id);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [nextTab]);

      return (
        <div className="min-h-screen pb-8">
          {/* Floating Header */}
          <header className="sticky top-0 z-50 mx-2 sm:mx-4 mt-2 sm:mt-4 bg-white/90 backdrop-blur-xl rounded-2xl shadow-medical-lg border border-white/60">
            <div className="px-4 sm:px-6 py-3 sm:py-4">
              <div className="flex items-center justify-between gap-3">
                <div className="flex items-center gap-3 sm:gap-4 min-w-0">
                  <div className="w-10 h-10 sm:w-12 sm:h-12 bg-gradient-to-br from-medical-500 to-health-500 rounded-lg flex items-center justify-center text-white shadow-medical flex-shrink-0">
                    {Icons.hospital}
                  </div>
                  <div className="min-w-0">
                    <h1 className="font-heading text-lg md:text-2xl font-bold text-medical-800 truncate">Hỗ trợ Nhập liệu Thăm khám</h1>
                    <p className="text-sm text-medical-600 hidden md:block">Phát triển Hành vi Nhi khoa</p>
                    {saveStatus && <p className="text-xs text-health-700 hidden sm:flex items-center gap-1 mt-0.5">{Icons.checkCircle}{saveStatus}</p>}
                  </div>
                </div>
                <div className="flex gap-2 sm:gap-3 flex-shrink-0">
                  <button onClick={requestReset} aria-label="Xóa dữ liệu" className="flex items-center gap-2 px-3 sm:px-4 py-2.5 bg-white text-red-600 rounded-lg hover:bg-red-50 transition-all duration-200 border border-red-100 hover:border-red-200 hover:shadow-md min-h-[44px]">
                    {Icons.trash}
                    <span className="hidden md:inline font-medium">Xóa</span>
                  </button>
                  <button onClick={handleGenerateOutput} disabled={isGenerating} aria-label="Tạo kết quả" className="flex items-center gap-2 px-4 sm:px-5 py-2.5 bg-gradient-to-r from-medical-500 to-medical-600 text-white rounded-lg hover:from-medical-600 hover:to-medical-700 transition-all duration-200 shadow-medical hover:shadow-medical-lg disabled:opacity-70 disabled:cursor-wait min-h-[44px]">
                    {Icons.sparkles}
                    <span className="font-semibold">{isGenerating ? 'Đang tạo...' : 'Tạo kết quả'}</span>
                  </button>
                </div>
              </div>
            </div>
            {/* Tab Navigation */}
            <div className="px-3 sm:px-4 pb-3">
              <nav className="tab-scroll flex gap-2 bg-medical-50 p-1.5 rounded-xl overflow-x-auto" role="tablist">
                {tabs.map((tab, idx) => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveMainTab(tab.id)}
                    role="tab"
                    aria-selected={activeMainTab === tab.id}
                    title={`Ctrl+${idx + 1} để chuyển nhanh`}
                    className={`relative min-w-[88px] sm:min-w-0 sm:flex-1 flex flex-col items-center justify-center gap-1 px-4 py-2 rounded-lg font-medium transition-all duration-200 min-h-[48px] ${activeMainTab === tab.id ? 'bg-white text-medical-700 shadow-card' : 'text-medical-600 hover:text-medical-700 hover:bg-white/50'}`}
                  >
                    <div className="flex items-center gap-2">
                      <span className={activeMainTab === tab.id ? 'text-medical-500' : 'text-medical-400'}>{tab.icon}</span>
                      <span className="hidden md:inline">{tab.label}</span>
                      <span className="md:hidden text-xs">{tab.shortLabel}</span>
                    </div>
                    {tab.progress > 0 && (
                      <div className="w-full h-1 bg-white rounded-full overflow-hidden mt-1 border border-medical-100">
                        <div className={`h-full rounded-full transition-all duration-300 ${tab.progress >= 80 ? 'bg-gradient-to-r from-health-400 to-health-600' : 'bg-gradient-to-r from-medical-400 to-health-500'}`} style={{ width: `${tab.progress}%` }} />
                      </div>
                    )}
                    {activeMainTab === tab.id && (
                      <span className="absolute bottom-0 left-1/2 -translate-x-1/2 w-8 h-1 bg-gradient-to-r from-medical-400 to-health-400 rounded-full" />
                    )}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          {/* Main Content */}
          <main id="main-content" className="max-w-4xl mx-auto px-4 mt-6 sm:mt-8">
            <div key={activeMainTab} className="animate-fade-in">
              {activeMainTab === 'tienCan' && (
                <>
                  <ProgressBar percentage={tabProgress.tienCan} label="Tiến độ hoàn thành Tiền căn" stepLabel="Bước 1/5" />
                  <TienCanTab formData={formData} updateField={updateField} />
                </>
              )}
              {activeMainTab === 'benhSu' && (
                <>
                  <ProgressBar percentage={tabProgress.benhSu} label="Tiến độ hoàn thành Bệnh sử" stepLabel="Bước 2/5" />
                  <BenhSuTab formData={formData} updateField={updateField} />
                </>
              )}
              {activeMainTab === 'kham' && (
                <>
                  <ProgressBar percentage={tabProgress.kham} label="Tiến độ hoàn thành Khám" stepLabel="Bước 3/5" />
                  <KhamTab formData={formData} updateField={updateField} caputeScores={caputeScores} />
                </>
              )}
              {activeMainTab === 'chiDinh' && (
                <>
                  <ProgressBar percentage={tabProgress.chiDinh} label="Tiến độ hoàn thành Chỉ định" stepLabel="Bước 4/5" />
                  <ChiDinhTab formData={formData} updateField={updateField} />
                </>
              )}
              {activeMainTab === 'ketQua' && (
                <>
                  <ProgressBar percentage={tabProgress.ketQua} label="Tiến độ hoàn thành Kết quả khám" stepLabel="Bước 5/5" />
                  <KetQuaKhamTab formData={formData} updateField={updateField} />
                </>
              )}
              <div className="mt-8 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
                <p className="text-sm text-medical-500">Ctrl+1-5 để chuyển tab nhanh. Dữ liệu được lưu tự động trên máy này.</p>
                {nextTab ? (
                  <button onClick={goToNextTab} className="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-3 rounded-lg bg-white text-medical-700 border border-medical-200 hover:border-medical-400 hover:bg-medical-50 shadow-card font-semibold transition-all duration-200 min-h-[44px]">
                    Tiếp tục: {nextTab.label}
                    <span className="-rotate-90">{Icons.chevronDown}</span>
                  </button>
                ) : (
                  <button onClick={handleGenerateOutput} disabled={isGenerating} className="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-3 rounded-lg bg-gradient-to-r from-medical-500 to-health-500 text-white shadow-medical hover:shadow-medical-lg font-semibold transition-all duration-200 disabled:opacity-70 disabled:cursor-wait min-h-[44px]">
                    {Icons.sparkles}
                    {isGenerating ? 'Đang tạo...' : 'Tạo kết quả'}
                  </button>
                )}
              </div>
            </div>
          </main>

          {/* Output Modal */}
          {showOutput && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in" onClick={() => setShowOutput(false)}>
              <div className="bg-white rounded-2xl w-full max-w-3xl max-h-[90vh] overflow-hidden shadow-2xl animate-slide-up" onClick={(e) => e.stopPropagation()}>
                <div className="bg-gradient-to-r from-medical-500 via-medical-600 to-health-500 px-5 sm:px-6 py-4 sm:py-5 flex items-center justify-between">
                  <h2 className="font-heading text-xl font-bold text-white flex items-center gap-3">
                    {Icons.document}
                    Kết quả Thăm khám
                  </h2>
                  <button onClick={() => setShowOutput(false)} aria-label="Đóng" className="w-10 h-10 flex items-center justify-center text-white/80 hover:text-white hover:bg-white/20 rounded-lg transition-all duration-200">
                    {Icons.x}
                  </button>
                </div>
                <div className="p-4 sm:p-5 overflow-y-auto max-h-[60vh] bg-gradient-to-b from-medical-50/50 to-white">
                  <textarea value={outputText} onChange={(e) => setOutputText(e.target.value)} className="w-full whitespace-pre-wrap font-body text-sm text-medical-800 leading-relaxed bg-white p-4 rounded-lg border border-medical-100 shadow-inner min-h-[320px] resize-y focus:border-medical-400 focus:ring-2 focus:ring-medical-100" spellCheck="false" aria-label="Kết quả thăm khám - có thể chỉnh sửa" />
                </div>
                <div className="px-5 sm:px-6 py-4 bg-medical-50 border-t border-medical-100 flex flex-col sm:flex-row gap-3 sm:justify-end">
                  <button onClick={copyToClipboard} className="w-full sm:w-auto flex items-center justify-center gap-2 px-5 py-3 bg-white text-medical-700 rounded-lg hover:bg-medical-100 transition-all duration-200 border border-medical-200 hover:border-medical-300 font-medium min-h-[48px]">
                    {Icons.copy}
                    Sao chép
                  </button>
                  <button onClick={exportToWord} className="w-full sm:w-auto flex items-center justify-center gap-2 px-5 py-3 bg-gradient-to-r from-health-500 to-health-600 text-white rounded-lg hover:from-health-600 hover:to-health-700 transition-all duration-200 shadow-medical hover:shadow-medical-lg font-semibold min-h-[48px]">
                    {Icons.download}
                    Tải Word
                  </button>
                </div>
              </div>
            </div>
          )}

          {showResetConfirm && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in" onClick={() => setShowResetConfirm(false)}>
              <div className="bg-white rounded-2xl w-full max-w-md overflow-hidden shadow-2xl animate-scale-in" onClick={(e) => e.stopPropagation()} role="dialog" aria-modal="true" aria-labelledby="reset-title">
                <div className="p-6">
                  <div className="w-12 h-12 rounded-lg bg-warning-100 text-warning-700 flex items-center justify-center mb-4">
                    {Icons.warning}
                  </div>
                  <h2 id="reset-title" className="font-heading text-xl font-bold text-medical-800 mb-2">Xóa dữ liệu đã nhập?</h2>
                  <p className="text-medical-600 leading-relaxed">Thao tác này sẽ xóa dữ liệu trong form và bản lưu tự động trên máy này.</p>
                </div>
                <div className="px-6 py-4 bg-medical-50 border-t border-medical-100 flex flex-col sm:flex-row gap-3 sm:justify-end">
                  <button onClick={() => setShowResetConfirm(false)} className="w-full sm:w-auto px-5 py-3 rounded-lg bg-white text-medical-700 border border-medical-200 hover:border-medical-300 font-semibold min-h-[44px]">Giữ lại</button>
                  <button onClick={resetForm} className="w-full sm:w-auto px-5 py-3 rounded-lg bg-red-600 text-white hover:bg-red-700 font-semibold shadow-card min-h-[44px]">Xóa dữ liệu</button>
                </div>
              </div>
            </div>
          )}

          {toast && (
            <div className={`fixed bottom-4 right-4 left-4 sm:left-auto sm:max-w-sm z-[60] flex items-center gap-3 rounded-lg border px-4 py-3 shadow-medical-lg animate-slide-up ${toast.type === 'warning' ? 'bg-warning-50 border-warning-200 text-warning-700' : 'bg-white border-health-200 text-health-700'}`} role="status" aria-live="polite">
              <span>{toast.type === 'warning' ? Icons.warning : Icons.checkCircle}</span>
              <span className="font-semibold text-sm">{toast.message}</span>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-12 text-center text-sm text-medical-500 pb-4">
            <p>Phiên bản 3.7 • 5 tabs + ATEC + Điều trị tái cấu trúc</p>
            <p className="text-xs mt-1 text-medical-400">Nhấn phím số (1-9) để chọn nhanh đáp án • Tab để chuyển câu hỏi • Ctrl+1-5 để chuyển tab</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MedicalExamApp />);
  </script>
</body>

</html>
